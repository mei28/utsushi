[project]
name = "utsushi"
version = "0.1.0"
description = "Slide deck transcoder for Keynote / PowerPoint / Google Slides."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "mei", email = "mei28aquarius@gmail.com" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "python-pptx>=1.0",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "keyring>=25",
]

[project.scripts]
utsushi = "utsushi.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utsushi"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "lxml-stubs>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Typer's idiomatic API requires calling typer.Option / typer.Argument
# inside parameter defaults; suppressing the rule project-wide is cleaner
# than scattering noqa comments through every CLI command.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# Google client libraries do not ship py.typed markers. Allow untyped
# calls inside the drive adapter so mypy strict can stay on for the
# rest of the project.
[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.*", "keyring.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["utsushi.adapters.drive"]
disallow_untyped_calls = false
warn_return_any = false
